[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madfinance"
version = "0.1.0"
description = "yfinance-style financial data for Moroccan listed companies (Casablanca Stock Exchange)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["morocco", "finance", "stock", "casablanca", "bourse", "yfinance", "MAD", "MASI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.5",
    "curl_cffi>=0.6",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/madfinance/madfinance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit live network sources (run with: pytest --live)",
]
